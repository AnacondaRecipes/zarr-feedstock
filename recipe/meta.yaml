{% set name = "zarr" %}
{% set version = "2.18.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2580d8cb6dd84621771a10d31c4d777dca8a27706a1a89b29f42d2d37e2df5ce

build:
  number: 0
  skip: True  # [py<310]
  script: {{PYTHON}} -m pip install . --no-deps --no-build-isolation --ignore-installed -vv

requirements:
  host:
    - pip
    - python
    - setuptools >=64.0.0
    - setuptools_scm >1.5.4
  run:
    - python
    - asciitree
    - numpy >=1.24
    - fasteners
    - numcodecs >=0.10.0
  run_constrained:
    - ipytree >=0.2.2
    - ipywidgets >=8.0.0

# AssertionError: assert {'attributes'...el': 1}}, ...} == {'attributes'...el': 1}}, ...}
{% set tests_to_skip = "test_encode_decode_array_dtype_shape_v3[zstd]" %}
# numpy._core._exceptions._UFuncOutputCastingError: Cannot cast ufunc 'subtract' output from dtype('int64') to dtype('uint8') with casting rule 'same_kind'
{% set tests_to_skip = tests_to_skip + " or test_cube_wcs_freqtovel" %}
# numpy._core._exceptions._UFuncOutputCastingError: Cannot cast ufunc 'subtract' output from dtype('int64') to dtype('uint8') with casting rule 'same_kind'
{% set tests_to_skip = tests_to_skip + " or test_array_with_delta_filter" %}

test:
  imports:
    - zarr
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v --pyargs zarr.tests -k "not ({{ tests_to_skip }})"

about:
  home: https://github.com/zarr-developers/zarr-python
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: An implementation of chunked, compressed, N-dimensional arrays for Python.
  description: |
    Zarr is a format for the storage of chunked, compressed, N-dimensional arrays. 
    These documents describe the Zarr format and its Python implementation.
  doc_url: https://zarr.readthedocs.io
  dev_url: https://github.com/zarr-developers/zarr-python

extra:
  recipe-maintainers:
    - alimanfoo
    - jakirkham
