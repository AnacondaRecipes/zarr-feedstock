{% set name = "zarr" %}
{% set version = "3.4.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 645d64f292f457120fc0ca18dbe38f665b4c21aaea38a2a88b5eead8f06f3d28

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv
  skip: true  # [py<312]
  entry_points:
    - zarr = zarr._cli.cli:app

requirements:
  host:
    - python
    - pip
    - hatchling >=1.29.0
    - hatch-vcs
    - setuptools-scm >=9
  run:
    - python
    - packaging >=22.0
    - numpy >=2
    - numcodecs >=0.16.6,!=0.17.0
    - google-crc32c >=1.5
    - typing_extensions >=4.14
    - donfig >=0.8
    - msgspec >=0.19
    # cli app
    - typer
  run_constrained:
    # extra remote
    - fsspec >=2023.10.0
    - obstore >=0.5.1
    # extra cast-value-rs
    - cast-value-rs >=0.4.2

{% set ignore_tests = " --ignore=tests/benchmarks/test_indexing.py" %}

test:
  source_files:
    - tests
  imports:
    - zarr
    - zarr.abc
    - zarr.api
    - zarr.buffer
    - zarr.codecs
    - zarr.core
    - zarr.dtype
    - zarr.errors
    - zarr.metadata
    - zarr.registry
    - zarr.storage
    - zarr.testing
  commands:
    - pip check
    - zarr --help
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -ra -vv tests -k "not slow and not (test_script_paths or test_write_array or test_read_array)" {{ ignore_tests }} --asyncio-mode=auto
  requires:
    - pip
    - coverage >=7.10
    - pytest
    - pytest-asyncio
    - botocore        
    - s3fs            # [not (win and arm64)]
    - requests
    - hypothesis
    - typer
    - numpydoc
    - tomlkit

about:
  home: https://github.com/zarr-developers/zarr-python
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: An implementation of chunked, compressed, N-dimensional arrays for Python.
  description: |
    Zarr is a format for the storage of chunked, compressed, N-dimensional arrays.
    These documents describe the Zarr format and its Python implementation.
  dev_url: https://github.com/zarr-developers/zarr-python
  doc_url: https://zarr.readthedocs.io

extra:
  recipe-maintainers:
    - alimanfoo
    - jakirkham
